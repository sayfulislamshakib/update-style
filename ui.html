<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Update Local Styles</title>
  <style>
    :root {
      --bg: var(--figma-color-bg, #ffffff);
      --surface: var(--figma-color-bg-secondary, #f5f5f5);
      --text: var(--figma-color-text, #1e1e1e);
      --text-secondary: var(--figma-color-text-secondary, #8c8c8c);
      --border: var(--figma-color-border, #e5e5e5);
      --primary: var(--figma-color-bg-brand, #18a0fb);
      --primary-hover: var(--figma-color-bg-brand-hover, #0d8de3);
      --success: #10b981;
      --tag-local: #e6f4ea;
      --tag-local-text: #137333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      font-size: 12px;
      user-select: none;
    }

    h2 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    p.desc {
      color: var(--text-secondary);
      font-size: 11px;
      line-height: 1.4;
      margin-bottom: 12px;
    }

    .stats-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .badge-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 500;
    }

    .badge.local {
      background: var(--tag-local);
      color: var(--tag-local-text);
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .btn-icon {
      background: transparent;
      border: none;
      color: var(--primary);
      font-size: 11px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 4px;
      transition: background 0.15s ease;
    }

    .btn-icon:hover {
      background: rgba(24, 160, 251, 0.08);
    }

    .btn-icon svg {
      width: 12px;
      height: 12px;
      fill: currentColor;
    }

    .options-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 12px;
    }

    .checkbox-container {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 12px;
      position: relative;
      user-select: none;
    }

    .checkbox-container input {
      position: absolute;
      opacity: 0;
      cursor: pointer;
      height: 0;
      width: 0;
    }

    .custom-checkbox {
      width: 16px;
      height: 16px;
      background-color: var(--bg);
      border: 1px solid var(--border);
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    .checkbox-container:hover input ~ .custom-checkbox {
      border-color: var(--primary);
    }

    .checkbox-container input:checked ~ .custom-checkbox {
      background-color: var(--primary);
      border-color: var(--primary);
    }

    .custom-checkbox svg {
      width: 10px;
      height: 10px;
      stroke: #ffffff;
      stroke-width: 2.2;
      fill: none;
      display: none;
    }

    .checkbox-container input:checked ~ .custom-checkbox svg {
      display: block;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      flex: 1;
      overflow-y: auto;
      margin-bottom: 12px;
      user-select: text;
    }

    .log-item {
      padding: 4px 0;
      border-bottom: 1px solid var(--border);
      font-size: 11px;
    }

    .log-item.error {
      color: #eb5757;
    }

    .stats-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-weight: 500;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    button {
      flex: 1;
      padding: 9px 12px;
      font-size: 12px;
      font-weight: 500;
      border-radius: 6px;
      border: 1px solid transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    button.primary {
      background: var(--primary);
      color: #fff;
    }

    button.primary:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    button.secondary {
      background: transparent;
      border-color: var(--border);
      color: var(--text);
    }

    button.secondary:hover:not(:disabled) {
      background: rgba(0, 0, 0, 0.04);
    }

    .select-container {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .select-label {
      font-size: 11px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .custom-select {
      width: 100%;
      padding: 6px 8px;
      font-size: 11px;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      outline: none;
      cursor: pointer;
      font-family: inherit;
    }

    .custom-select:focus {
      border-color: var(--primary);
    }
  </style>
</head>
<body>
  <h2>Sync Local Styles</h2>
  <p class="desc">
    Matches and applies your document's local text and color styles to selected layers.
  </p>

  <div class="stats-card">
    <div class="badge-group">
      <span class="badge local" id="badgeLocalText">
        <span class="badge-dot"></span>
        <span id="txtLocalCount">0 Text</span>
      </span>
      <span class="badge local" id="badgeLocalColor" style="background: #eef2ff; color: #4338ca;">
        <span class="badge-dot"></span>
        <span id="colorLocalCount">0 Color Styles/Vars</span>
      </span>
    </div>
    <div>
      <button class="btn-icon" id="btnRescan" title="Rescan local styles in document">
        <svg viewBox="0 0 16 16">
          <path d="M13.65 2.35A7.958 7.958 0 0 0 8 0a8 8 0 1 0 8 8h-2a6 6 0 1 1-1.76-4.24L10 6h6V0l-2.35 2.35z"/>
        </svg>
        Rescan
      </button>
    </div>
  </div>

  <div class="options-group">
    <div class="select-container" id="modeSelectContainer" style="display: none;">
      <label class="select-label" for="selVariableMode">Match Variable Color Mode:</label>
      <select class="custom-select" id="selVariableMode">
        <option value="AUTO">Auto / Default Mode</option>
      </select>
    </div>

    <label class="checkbox-container">
      <input type="checkbox" id="chkIgnoreInstances" checked />
      <div class="custom-checkbox">
        <svg viewBox="0 0 12 10">
          <polyline points="1.5 5 4.5 8.5 10.5 1.5"></polyline>
        </svg>
      </div>
      <span>Ignore component instances</span>
    </label>
  </div>

  <div class="panel" id="logContainer">
    <div id="idleState" style="color: var(--text-secondary); text-align: center; margin-top: 24px;">
      Select frames or text layers on canvas and click <b>Update Styles</b>.
    </div>
    <div id="statsState" style="display: none;">
      <div class="stats-row"><span>Total Inspected:</span><span id="statInspected">0</span></div>
      <div class="stats-row"><span>Updated:</span><span id="statUpdated" style="color: var(--success);">0</span></div>
      <div class="stats-row" style="padding-left: 8px; font-size: 11px; color: var(--text-secondary);"><span>↳ Text Styles:</span><span id="statTextUpdated">0</span></div>
      <div class="stats-row" style="padding-left: 8px; font-size: 11px; color: var(--text-secondary);"><span>↳ Colors (Styles/Vars):</span><span id="statColorUpdated">0</span></div>
      <div class="stats-row"><span>Skipped:</span><span id="statSkipped">0</span></div>
      <hr style="border: 0; border-top: 1px solid var(--border); margin: 6px 0;" />
      <div id="logList"></div>
    </div>
  </div>

  <div class="actions">
    <button class="secondary" id="btnCancel">Cancel</button>
    <button class="primary" id="btnRun">Update Styles</button>
  </div>

  <script>
    const btnRun = document.getElementById("btnRun");
    const btnCancel = document.getElementById("btnCancel");
    const btnRescan = document.getElementById("btnRescan");
    const chkIgnoreInstances = document.getElementById("chkIgnoreInstances");
    const modeSelectContainer = document.getElementById("modeSelectContainer");
    const selVariableMode = document.getElementById("selVariableMode");
    const txtLocalCount = document.getElementById("txtLocalCount");
    const colorLocalCount = document.getElementById("colorLocalCount");
    const idleState = document.getElementById("idleState");
    const statsState = document.getElementById("statsState");
    const statInspected = document.getElementById("statInspected");
    const statUpdated = document.getElementById("statUpdated");
    const statTextUpdated = document.getElementById("statTextUpdated");
    const statColorUpdated = document.getElementById("statColorUpdated");
    const statSkipped = document.getElementById("statSkipped");
    const logList = document.getElementById("logList");

    let savedSelectedMode = "AUTO";

    function saveCurrentSettings() {
      parent.postMessage(
        {
          pluginMessage: {
            type: "save-settings",
            settings: {
              ignoreInstances: chkIgnoreInstances.checked,
              variableMode: selVariableMode.value,
            },
          },
        },
        "*"
      );
    }

    chkIgnoreInstances.onchange = saveCurrentSettings;
    selVariableMode.onchange = saveCurrentSettings;

    btnRun.onclick = () => {
      btnRun.disabled = true;
      btnRun.textContent = "Processing...";

      parent.postMessage(
        {
          pluginMessage: {
            type: "run-replace-styles",
            options: {
              ignoreInstances: chkIgnoreInstances.checked,
              variableMode: selVariableMode.value,
            },
          },
        },
        "*"
      );
    };

    btnCancel.onclick = () => {
      parent.postMessage({ pluginMessage: { type: "cancel" } }, "*");
    };

    btnRescan.onclick = () => {
      parent.postMessage({ pluginMessage: { type: "rescan-styles" } }, "*");
    };

    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === "load-settings" && msg.settings) {
        if (typeof msg.settings.ignoreInstances === "boolean") {
          chkIgnoreInstances.checked = msg.settings.ignoreInstances;
        }
        if (msg.settings.variableMode) {
          savedSelectedMode = msg.settings.variableMode;
          selVariableMode.value = msg.settings.variableMode;
        }
      }

      if (msg.type === "styles-detected") {
        txtLocalCount.textContent = `${msg.textCount} Text Style${msg.textCount === 1 ? "" : "s"}`;
        colorLocalCount.textContent = `${msg.colorCount} Color Style/Var${msg.colorCount === 1 ? "" : "s"}`;

        if (msg.modes && msg.modes.length > 0) {
          selVariableMode.innerHTML = `<option value="AUTO">Auto / Default Mode</option>`;

          if (msg.uniqueModeNames && msg.uniqueModeNames.length > 0) {
            const grp = document.createElement("optgroup");
            grp.label = "All Collections (by Name)";
            msg.uniqueModeNames.forEach((name) => {
              const opt = document.createElement("option");
              opt.value = `NAME:${name}`;
              opt.textContent = `Mode: ${name}`;
              grp.appendChild(opt);
            });
            selVariableMode.appendChild(grp);
          }

          if (msg.collections && msg.collections.length > 0) {
            msg.collections.forEach((col) => {
              const grp = document.createElement("optgroup");
              grp.label = `Collection: ${col.name}`;
              col.modes.forEach((m) => {
                const opt = document.createElement("option");
                opt.value = `${col.id}:${m.id}`;
                opt.textContent = `${m.name}${col.defaultModeId === m.id ? " (Default)" : ""}`;
                grp.appendChild(opt);
              });
              selVariableMode.appendChild(grp);
            });
          }

          modeSelectContainer.style.display = "flex";
          if (savedSelectedMode) {
            selVariableMode.value = savedSelectedMode;
          }
        } else {
          modeSelectContainer.style.display = "none";
        }
      }

      if (msg.type === "process-start") {
        idleState.style.display = "none";
        statsState.style.display = "block";
        logList.innerHTML = "";
      }

      if (msg.type === "process-complete") {
        btnRun.disabled = false;
        btnRun.textContent = "Update Styles";

        const { summary } = msg;
        statInspected.textContent = summary.totalInspected;
        statUpdated.textContent = summary.totalUpdated;
        statTextUpdated.textContent = summary.textUpdated || 0;
        statColorUpdated.textContent = summary.colorUpdated || 0;
        statSkipped.textContent = summary.totalSkipped;

        if (summary.errors && summary.errors.length > 0) {
          summary.errors.forEach((err) => {
            const item = document.createElement("div");
            item.className = "log-item error";
            item.textContent = err;
            logList.appendChild(item);
          });
        }
      }
    };
  </script>
</body>
</html>
